<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MST Inventory</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      color: #222;
      min-height: 100vh;
    }

    /* ── LOGIN ─────────────────────────────────────────── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.1);
      padding: 40px 36px;
      width: 340px;
    }
    .login-card h1 { font-size: 1.4rem; margin-bottom: 6px; color: #1a56db; }
    .login-card p  { font-size: .85rem; color: #666; margin-bottom: 24px; }
    .login-card label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 4px; color: #444; }
    .login-card input {
      width: 100%; padding: 9px 12px; border: 1px solid #d1d5db;
      border-radius: 7px; font-size: .95rem; margin-bottom: 16px;
      outline: none; transition: border-color .2s;
    }
    .login-card input:focus { border-color: #1a56db; }
    .btn-primary {
      width: 100%; padding: 10px; background: #1a56db; color: #fff;
      border: none; border-radius: 7px; font-size: 1rem;
      font-weight: 600; cursor: pointer; transition: background .2s;
    }
    .btn-primary:hover { background: #1447b8; }
    #login-error { color: #dc2626; font-size: .85rem; margin-top: 10px; display: none; }

    /* ── APP SHELL ─────────────────────────────────────── */
    #app-screen { display: none; }

    header {
      background: #1a56db;
      color: #fff;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    header h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: .5px; }
    header .user-info { display: flex; align-items: center; gap: 12px; font-size: .9rem; }
    .badge-admin {
      background: #fbbf24; color: #78350f;
      font-size: .72rem; font-weight: 700;
      padding: 2px 8px; border-radius: 999px;
    }
    .btn-logout {
      background: rgba(255,255,255,.2); color: #fff; border: none;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: .85rem;
      transition: background .2s;
    }
    .btn-logout:hover { background: rgba(255,255,255,.35); }

    /* ── TOOLBAR ───────────────────────────────────────── */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 10px;
      padding: 16px 28px; background: #fff;
      border-bottom: 1px solid #e5e7eb;
      align-items: center;
    }
    .toolbar input[type=search], .toolbar select {
      padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 7px;
      font-size: .9rem; outline: none; transition: border-color .2s;
    }
    .toolbar input[type=search] { width: 260px; }
    .toolbar input[type=search]:focus,
    .toolbar select:focus { border-color: #1a56db; }
    .btn-clear {
      padding: 8px 14px; border: 1px solid #d1d5db; background: #fff;
      border-radius: 7px; font-size: .85rem; cursor: pointer; color: #555;
      transition: background .2s;
    }
    .btn-clear:hover { background: #f3f4f6; }
    .results-count { margin-left: auto; font-size: .82rem; color: #6b7280; }

    /* ── TABLE ─────────────────────────────────────────── */
    .table-wrap {
      padding: 20px 28px;
      overflow-x: auto;
    }
    table {
      width: 100%; border-collapse: collapse; background: #fff;
      border-radius: 10px; overflow: hidden;
      box-shadow: 0 1px 6px rgba(0,0,0,.07);
      font-size: .9rem;
    }
    thead tr { background: #1a56db; color: #fff; }
    thead th { padding: 12px 14px; text-align: left; font-weight: 600; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #f3f4f6; transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f0f5ff; }
    tbody td { padding: 11px 14px; }
    .serials { font-size: .78rem; color: #6b7280; }
    .qty-badge {
      display: inline-block; background: #dcfce7; color: #166534;
      padding: 2px 9px; border-radius: 999px; font-size: .78rem; font-weight: 700;
    }
    .cost-col { color: #6b7280; font-size: .85rem; }
    .admin-col { background: #fffbeb; }

    /* ── PAGINATION ────────────────────────────────────── */
    .pagination {
      display: flex; justify-content: center; align-items: center;
      gap: 6px; padding: 16px 28px;
    }
    .pagination button {
      padding: 6px 13px; border: 1px solid #d1d5db; background: #fff;
      border-radius: 6px; cursor: pointer; font-size: .85rem; transition: background .2s;
    }
    .pagination button:hover:not(:disabled) { background: #eff6ff; border-color: #1a56db; color: #1a56db; }
    .pagination button.active { background: #1a56db; color: #fff; border-color: #1a56db; }
    .pagination button:disabled { opacity: .4; cursor: default; }

    /* ── LOADING / EMPTY ───────────────────────────────── */
    .state-msg {
      text-align: center; padding: 48px 20px; color: #9ca3af; font-size: .95rem;
    }
    .spinner {
      display: inline-block; width: 30px; height: 30px;
      border: 3px solid #e5e7eb; border-top-color: #1a56db;
      border-radius: 50%; animation: spin .7s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<!-- ══ LOGIN ══════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-card">
    <h1>MST Inventory</h1>
    <p>Sign in to access the inventory system</p>
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="admin" autocomplete="username" />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
    <button class="btn-primary" onclick="doLogin()">Sign In</button>
    <p id="login-error"></p>
    <p style="margin-top:14px;font-size:.8rem;color:#aaa">
      Leave credentials empty to browse as guest (no cost/VAT data)
    </p>
    <button class="btn-primary" style="margin-top:6px;background:#6b7280" onclick="guestMode()">
      Continue as Guest
    </button>
  </div>
</div>

<!-- ══ APP ════════════════════════════════════════════════ -->
<div id="app-screen">
  <header>
    <h1>📦 MST Inventory</h1>
    <div class="user-info">
      <span id="header-user"></span>
      <span id="header-badge" class="badge-admin" style="display:none">ADMIN</span>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="toolbar">
    <input type="search" id="search-input" placeholder="🔍 Search by name…" oninput="onSearchInput()" />
    <select id="cat-filter" onchange="applyFilters()">
      <option value="">All Categories</option>
    </select>
    <select id="brand-filter" onchange="applyFilters()">
      <option value="">All Brands</option>
    </select>
    <button class="btn-clear" onclick="clearFilters()">✕ Clear</button>
    <span class="results-count" id="results-count"></span>
  </div>

  <div class="table-wrap">
    <div id="table-state" class="state-msg">
      <div class="spinner"></div><br>Loading inventory…
    </div>
    <table id="inv-table" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Category</th>
          <th>Brand</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Serials</th>
          <th id="col-cost" style="display:none" class="admin-col">Cost</th>
          <th id="col-vat"  style="display:none" class="admin-col">VAT</th>
        </tr>
      </thead>
      <tbody id="inv-body"></tbody>
    </table>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<script>
  // ── Config ────────────────────────────────────────────
  const API = 'https://mahmoud1990.ddns.net:7186/api';
  const PAGE_SIZE = 50;

  // ── State ─────────────────────────────────────────────
  let token      = null;
  let isAdmin    = false;
  let allItems   = [];
  let filtered   = [];
  let currentPage = 1;
  let searchTimer = null;
  let currentSearch = '';

  // ── Auth helpers ──────────────────────────────────────
  function authHeaders() {
    const h = { 'Content-Type': 'application/json' };
    if (token) h['Authorization'] = 'Bearer ' + token;
    return h;
  }

  async function doLogin() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const err = document.getElementById('login-error');
    err.style.display = 'none';

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      if (!res.ok) throw new Error('Invalid credentials');
      const data = await res.json();
      token   = data.token;
      isAdmin = true;
      startApp('admin');
    } catch (e) {
      err.textContent = e.message;
      err.style.display = 'block';
    }
  }

  function guestMode() {
    token   = null;
    isAdmin = false;
    startApp('Guest');
  }

  function logout() {
    token = null; isAdmin = false;
    document.getElementById('app-screen').style.display  = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('password').value = '';
  }

  // ── Boot ──────────────────────────────────────────────
  async function startApp(username) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display   = 'block';
    document.getElementById('header-user').textContent    = username;
    document.getElementById('header-badge').style.display = isAdmin ? 'inline' : 'none';

    document.getElementById('col-cost').style.display = isAdmin ? '' : 'none';
    document.getElementById('col-vat').style.display  = isAdmin ? '' : 'none';

    await Promise.all([loadCategories(), loadBrands()]);
    await loadInventory();
  }

  // ── Dropdowns ─────────────────────────────────────────
  async function loadCategories() {
    try {
      const res  = await fetch(`${API}/inventory/categories`, { headers: authHeaders() });
      const data = await res.json();
      const sel  = document.getElementById('cat-filter');
      data.forEach(c => {
        const o = document.createElement('option');
        o.value = c.id; o.textContent = c.name;
        sel.appendChild(o);
      });
    } catch { }
  }

  async function loadBrands() {
    try {
      const res  = await fetch(`${API}/inventory/brands`, { headers: authHeaders() });
      const data = await res.json();
      const sel  = document.getElementById('brand-filter');
      data.forEach(b => {
        const o = document.createElement('option');
        o.value = b.id; o.textContent = b.name;
        sel.appendChild(o);
      });
    } catch { }
  }

  // ── Inventory ─────────────────────────────────────────
  async function loadInventory(search = '') {
    showLoading();
    try {
      const params = new URLSearchParams({ page: 1, pageSize: 1000 });
      if (search) params.set('search', search);
      const res = await fetch(`${API}/inventory?${params}`, { headers: authHeaders() });
      if (!res.ok) throw new Error('Failed to load inventory');
      allItems = await res.json();
    } catch (e) {
      showEmpty('⚠️ ' + e.message);
      return;
    }
    currentPage = 1;
    applyFilters();
  }

  // ── Filters ───────────────────────────────────────────
  function applyFilters() {
    const catId   = document.getElementById('cat-filter').value;
    const brandId = document.getElementById('brand-filter').value;

    filtered = allItems.filter(item => {
      if (catId   && String(item.categoryId) !== catId)   return false;
      if (brandId && String(item.brandId)    !== brandId) return false;
      return true;
    });

    currentPage = 1;
    renderTable();
  }

  function clearFilters() {
    document.getElementById('search-input').value = '';
    document.getElementById('cat-filter').value   = '';
    document.getElementById('brand-filter').value = '';
    currentSearch = '';
    loadInventory();
  }

  // ── Search (debounced 350 ms) ─────────────────────────
  function onSearchInput() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const q = document.getElementById('search-input').value.trim();
      if (q === currentSearch) return;
      currentSearch = q;
      loadInventory(q);
    }, 350);
  }

  // ── Render table ──────────────────────────────────────
  function renderTable() {
    const tbody = document.getElementById('inv-body');
    const total = filtered.length;

    document.getElementById('results-count').textContent =
      total === 0 ? 'No results' : `${total} item${total !== 1 ? 's' : ''}`;

    if (total === 0) { showEmpty('No items match your filters.'); renderPagination(0); return; }

    const start = (currentPage - 1) * PAGE_SIZE;
    const page  = filtered.slice(start, start + PAGE_SIZE);

    tbody.innerHTML = page.map((item, i) => `
      <tr>
        <td style="color:#9ca3af;font-size:.8rem">${start + i + 1}</td>
        <td><strong>${esc(item.name)}</strong></td>
        <td>${esc(item.categoryName)}</td>
        <td>${esc(item.brandName)}</td>
        <td>${fmt(item.price)}</td>
        <td><span class="qty-badge">${item.totalQuantity}</span></td>
        <td class="serials">${item.serials?.join(', ') || '—'}</td>
        ${isAdmin ? `
          <td class="cost-col admin-col">${item.cost != null ? fmt(item.cost) : '—'}</td>
          <td class="cost-col admin-col">${item.vat  != null ? fmt(item.vat)  : '—'}</td>
        ` : ''}
      </tr>
    `).join('');

    document.getElementById('inv-table').style.display  = '';
    document.getElementById('table-state').style.display = 'none';
    renderPagination(total);
  }

  // ── Pagination ────────────────────────────────────────
  function renderPagination(total) {
    const pages = Math.ceil(total / PAGE_SIZE);
    const el    = document.getElementById('pagination');
    if (pages <= 1) { el.innerHTML = ''; return; }

    let html = `<button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>`;
    for (let i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - currentPage) <= 2)
        html += `<button class="${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      else if (Math.abs(i - currentPage) === 3)
        html += `<span style="padding:0 4px;color:#9ca3af">…</span>`;
    }
    html += `<button onclick="goPage(${currentPage+1})" ${currentPage===pages?'disabled':''}>Next ›</button>`;
    el.innerHTML = html;
  }

  function goPage(p) { currentPage = p; renderTable(); window.scrollTo(0, 0); }

  // ── Utilities ─────────────────────────────────────────
  function showLoading() {
    document.getElementById('table-state').innerHTML    = '<div class="spinner"></div><br>Loading…';
    document.getElementById('table-state').style.display = '';
    document.getElementById('inv-table').style.display  = 'none';
    document.getElementById('pagination').innerHTML      = '';
    document.getElementById('results-count').textContent = '';
  }
  function showEmpty(msg) {
    document.getElementById('table-state').innerHTML     = msg;
    document.getElementById('table-state').style.display  = '';
    document.getElementById('inv-table').style.display   = 'none';
  }
  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function fmt(n) {
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && document.getElementById('login-screen').style.display !== 'none')
      doLogin();
  });
</script>
</body>
</html>
