<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alphatech Offers</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      background: #111;
      color: white;
      padding: 15px;
      margin: 0;
    }

    #image-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
    }

    #offer-image {
      border: 1px solid #ccc;
      width: 95%;
      max-width: 600px;
      height: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .controls {
      margin: 10px;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .social-buttons {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 9999;
    }

    .social-buttons a {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
      text-decoration: none;
    }

    .social-buttons a img {
      width: 28px;
      height: 28px;
    }

    @media (max-width: 600px) {
      button {
        font-size: 14px;
        padding: 6px 10px;
      }
    }
  </style>
</head>

<body>

  <h1>Alphatech Offers</h1>

  <div id="image-container">
    <img id="offer-image" src="LAPTOP_OFFERS/1.png" alt="Offer Image" />

    <div class="controls">
      <button id="prev-page">⬅ Previous</button>
      <span id="page-info"></span>
      <button id="next-page">Next ➡</button>
    </div>
  </div>

  <script>
    const totalPages = 11;   // number of images
    let currentPage = 1;

    const imageElement = document.getElementById('offer-image');
    const pageInfo = document.getElementById('page-info');
    const prevBtn = document.getElementById('prev-page');
    const nextBtn = document.getElementById('next-page');

    function updateImage() {
      imageElement.src = `LAPTOP_OFFERS/${currentPage}.png`;
      pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;

      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;
    }

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        updateImage();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage++;
        updateImage();
      }
    });

    updateImage();
  </script>


  <div class="social-buttons">

    <!-- WhatsApp -->
    <a href="https://wa.me/972548838689" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" />
    </a>

    <!-- Facebook -->
    <a href="https://www.facebook.com/alphatech.computers" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" alt="Facebook" />
    </a>

    <!-- Instagram -->
    <a href="https://www.instagram.com/alphatechcomputers" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram" />
    </a>

    <!-- TikTok -->
    <a href="https://www.tiktok.com/@alphatech.computers" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg" alt="TikTok" />
    </a>

  </div>
<footer class="store-footer">

  <div class="footer-content">

</footer>
</body>

</html>
